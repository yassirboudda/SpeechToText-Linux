<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpeechToText</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 320px; font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc, #eef2ff); color: #1e293b;
    }
    .wrap { padding: 18px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .header img { width: 40px; height: 40px; border-radius: 10px; }
    h1 { margin: 0; font-size: 18px; font-weight: 800; }
    .sub { margin: 2px 0 0; font-size: 11px; color: #64748b; }
    .card {
      background: white; border-radius: 14px; padding: 16px;
      border: 1px solid #e2e8f0; box-shadow: 0 4px 14px rgba(79,70,229,.06);
    }
    p { font-size: 12px; color: #64748b; line-height: 1.5; margin: 0 0 14px; }
    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: white;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }
    .link-btn {
      width: 100%; margin-top: 10px; border: 1px solid #e2e8f0; background: white;
      border-radius: 10px; padding: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="icons/icon48.png" alt="SpeechToText" />
      <div>
        <h1>SpeechToText</h1>
        <p class="sub">Mistral Voxtral · 1:10 max</p>
      </div>
    </div>
    <div class="card">
      <p>
        Recording opens in a tab so Chrome can request your microphone.
        Keep that tab open while you record.
      </p>
      <button class="btn" id="openBtn">Open Recorder</button>
      <button class="link-btn" id="settingsBtn">Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
