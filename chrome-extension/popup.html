<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpeechToText</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 360px; font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc, #eef2ff); color: #1e293b;
    }
    .wrap { padding: 18px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .header img { width: 40px; height: 40px; border-radius: 10px; }
    h1 { margin: 0; font-size: 18px; font-weight: 800; }
    .sub { margin: 2px 0 0; font-size: 11px; color: #64748b; }
    .card {
      background: white; border-radius: 14px; padding: 16px;
      border: 1px solid #e2e8f0; box-shadow: 0 4px 14px rgba(79,70,229,.06);
    }
    .status { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 12px; min-height: 18px; }
    .record-btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: white;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }
    .record-btn.recording { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .record-btn:disabled { opacity: .6; cursor: not-allowed; }
    textarea {
      width: 100%; min-height: 120px; margin-top: 12px; border-radius: 10px;
      border: 1.5px solid #e2e8f0; padding: 10px; font-size: 13px; resize: vertical;
      font-family: inherit;
    }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button {
      flex: 1; border: 1px solid #e2e8f0; background: white; border-radius: 10px;
      padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .actions button.primary { background: #4f46e5; color: white; border-color: #4f46e5; }
    .footer { margin-top: 12px; text-align: center; font-size: 11px; color: #94a3b8; }
    a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="icons/icon48.png" alt="SpeechToText" />
      <div>
        <h1>SpeechToText</h1>
        <p class="sub">Mistral Voxtral · 1:10 max</p>
      </div>
    </div>
    <div class="card">
      <div class="status" id="status">Ready — click Start to allow microphone</div>
      <p class="hint" id="hint" style="font-size:11px;color:#64748b;text-align:center;margin:0 0 10px;">Microphone permission is requested when you click Start</p>
      <button class="record-btn" id="recordBtn">🎙 Start Recording</button>
      <textarea id="output" placeholder="Transcription appears here…" readonly></textarea>
      <div class="actions">
        <button id="copyBtn" class="primary">Copy</button>
        <button id="clearBtn">Clear</button>
        <button id="settingsBtn">Settings</button>
      </div>
    </div>
    <div class="footer">
      <a href="https://github.com/yassirboudda/SpeechToText-Linux" target="_blank">Desktop version</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
