<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpeechToText — Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc, #eef2ff); color: #1e293b;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .wrap { width: 100%; max-width: 420px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .header img { width: 48px; height: 48px; border-radius: 12px; }
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .sub { margin: 4px 0 0; font-size: 12px; color: #64748b; }
    .card {
      background: white; border-radius: 16px; padding: 20px;
      border: 1px solid #e2e8f0; box-shadow: 0 8px 24px rgba(79,70,229,.08);
    }
    .status { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 12px; min-height: 20px; }
    .hint { font-size: 12px; color: #64748b; text-align: center; margin: 0 0 14px; line-height: 1.5; }
    .perm-panel {
      text-align: center; padding: 8px 0 4px;
    }
    .perm-panel p { font-size: 13px; color: #475569; line-height: 1.55; margin: 0 0 14px; }
    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: white;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }
    .btn.secondary {
      background: white; color: #4f46e5; border: 1.5px solid #c7d2fe; margin-top: 10px;
    }
    .btn.recording { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    textarea {
      width: 100%; min-height: 140px; margin-top: 14px; border-radius: 10px;
      border: 1.5px solid #e2e8f0; padding: 12px; font-size: 14px; resize: vertical;
      font-family: inherit;
    }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button {
      flex: 1; border: 1px solid #e2e8f0; background: white; border-radius: 10px;
      padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .actions button.primary { background: #4f46e5; color: white; border-color: #4f46e5; }
    .hidden { display: none !important; }
    .footer { margin-top: 14px; text-align: center; font-size: 12px; color: #94a3b8; }
    a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="icons/icon48.png" alt="SpeechToText" />
      <div>
        <h1>SpeechToText</h1>
        <p class="sub">Mistral Voxtral · max 1:10 · keep this tab open while recording</p>
      </div>
    </div>
    <div class="card">
      <div class="perm-panel" id="permPanel">
        <p>
          Chrome cannot request the microphone from the small extension popup.
          Click below — Chrome will show a permission prompt for this extension.
        </p>
        <button class="btn" id="allowBtn">Allow microphone access</button>
        <button class="btn secondary hidden" id="settingsBtn">Open extension microphone settings</button>
      </div>

      <div id="recPanel" class="hidden">
        <div class="status" id="status">Ready to record</div>
        <p class="hint" id="hint">Speak clearly, then click Stop &amp; Transcribe</p>
        <button class="btn" id="recordBtn">🎙 Start Recording</button>
        <textarea id="output" placeholder="Transcription appears here…" readonly></textarea>
        <div class="actions">
          <button id="copyBtn" class="primary">Copy</button>
          <button id="clearBtn">Clear</button>
        </div>
      </div>
    </div>
    <div class="footer">
      <a href="options.html" target="_blank">Settings</a>
    </div>
  </div>
  <script type="module" src="recorder.js"></script>
</body>
</html>
